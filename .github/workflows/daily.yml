name: Second Brain Daily Morning Briefing

on:
  schedule:
    # 每天 UTC 时间 23:50 执行（对应北京时间早上 07:50，提前避开整点排队拥堵，确保 8 点前准时送达）
    - cron: '50 23 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上随时手动点击测试

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Daily Briefing Daemon
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python main.py

