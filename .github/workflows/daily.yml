name: Second Brain Daily Morning Briefing

on:
  schedule:
    # 每天 UTC 时间 00:00 执行（对应北京时间早上 08:00）
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch: # 支持在 GitHub 网页上手动点击一键运行

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Daily Briefing Daemon
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          python main.py
